name: CI

# Runs on every push and pull request: type check, unit tests, production build.
# No secrets, no external services — everything is static.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (astro check)
        run: npm run check
        env:
          ASTRO_TELEMETRY_DISABLED: '1'

      - name: Unit tests (vitest)
        run: npm run test

      - name: Build
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'

      - name: Budget check (initial JS/CSS/HTML)
        run: npm run budget

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
